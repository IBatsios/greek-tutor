# Tooling config only. Runtime deps live in requirements.txt (see README).

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends()/Form() in defaults is the FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"app/claude_client.py" = ["E501"]  # prompt text reads better unwrapped
