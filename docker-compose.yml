# Greek Tutor — Postgres + one-shot migrator + web app.
#
#   cp .env.example .env        # set POSTGRES_PASSWORD, ANTHROPIC_API_KEY, COOKIE_SECRET
#   docker compose up -d --build
#   open http://127.0.0.1:8080
#
#   docker compose --profile test run --rm test     # ruff + full pytest against a throwaway DB
#
# The app binds to 127.0.0.1 only; expose it through Caddy or a Cloudflare Tunnel.

name: greek-tutor

x-app-build: &app-build
  context: .
  target: runtime
  args:
    # LLM_BACKEND=claude_cli needs the claude binary in the image. Pin the version
    # (e.g. 2.1.283) once a real session works; "stable" tracks Anthropic's channel.
    WITH_CLAUDE_CLI: ${WITH_CLAUDE_CLI:-false}
    CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-stable}

x-app-env: &app-env
  # Overrides DATABASE_URL from .env so the containers reach the `db` service.
  DATABASE_URL: postgresql://tutor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/greektutor

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: greektutor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only, for running the app with Python on the host (RUNBOOK.md, modes C/D).
      # 5433 so it never collides with a Postgres installed on the host.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d greektutor"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: *app-build
    image: greek-tutor:latest
    env_file: .env
    environment: *app-env
    command: ["python", "scripts/migrate.py"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: *app-build
    image: greek-tutor:latest
    env_file: .env
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # Board mirror for the tracker: set HARADA_EXPORT_PATH=/export/greek-board.json
      - ./export:/export
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  # --- test profile: never starts with a plain `docker compose up` ---------------
  db-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: greektutor_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d greektutor_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    profiles: ["test"]
    build: { context: ., target: dev }
    image: greek-tutor:dev
    environment:
      DATABASE_URL: postgresql://tutor:tutor@db-test:5432/greektutor_test
      TEST_DATABASE_URL: postgresql://tutor:tutor@db-test:5432/greektutor_test
      ANTHROPIC_API_KEY: test-key-never-sent
      COOKIE_SECRET: test-cookie-secret
    command: ["sh", "-c", "python scripts/migrate.py && ruff check app tests scripts && pytest -p no:cacheprovider"]
    depends_on:
      db-test: { condition: service_healthy }

volumes:
  pgdata:
